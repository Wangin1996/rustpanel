# rust-panel nginx front (single-port design).
# TLS certs at /etc/nginx/certs/{fullchain.pem,privkey.pem}.
#
# CRITICAL: the agent WebSocket (/api/v1/agent/ws) is a long-lived connection.
# It needs Upgrade/Connection headers AND a long proxy_read_timeout, otherwise
# nginx drops it after the default 60s (agent sees "close 1006"). See that block.

# WebSocket upgrade helper (http{} context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $panel_log_uri {
    default $uri;
    ~^/.*/[A-Za-z0-9._~-]{32,192}/?$ /:subscription;
}

# Sanitized access log: path only (no query), no Authorization, no body.
log_format panel_min escape=json
  '{"time":"$time_iso8601",'
   '"remote":"$remote_addr",'
   '"method":"$request_method",'
   '"uri":"$panel_log_uri",'
   '"status":$status,'
   '"bytes":$body_bytes_sent,'
   '"rt":$request_time}';

limit_req_zone  $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=gw:10m      rate=5r/s;
limit_req_zone  $binary_remote_addr zone=sub:10m     rate=2r/s;
limit_req_zone  $binary_remote_addr zone=ws:10m      rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream panel_backend {
    server 127.0.0.1:8080;   # rust-panel APP_BIND (change if different)
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    client_header_timeout 10s;
    client_body_timeout   10s;
    keepalive_timeout     30s;
    client_max_body_size  256k;
    limit_req_status      429;
    limit_conn_status     429;
    limit_conn perip      20;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/panel.log panel_min;

    # ── agent WebSocket: real-time config push. MUST keep alive. ──
    location = /api/v1/agent/ws {
        limit_req zone=ws burst=10 nodelay;
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;    # >> the 25s app-ping; prevents 1006 drops
        proxy_send_timeout  3600s;
    }

    # ── gateway RPC ──
    location = /api/v1/gateway {
        limit_req zone=gw burst=20 nodelay;
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── subscription (/s/<token> + your custom path) ──
    location ^~ /s/ {
        access_log off;
        limit_req zone=sub burst=5 nodelay;
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── admin SPA (/ or /<admin_path>) + user portal (/app) + static assets ──
    # The panel serves these itself; proxy everything else through.
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
